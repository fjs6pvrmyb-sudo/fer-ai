name: E2E FER AI (Supabase local desechable)

# Solo ramas de QA: levanta Supabase local en el runner, sin red hacia QA
# alojado ni secretos del repositorio. Todas las cuentas y datos son ficticios.
on:
  push:
    branches:
      - "qa/e2e-**"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: 1
      FER_INTELLIGENCE_MODE: demo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local con las migraciones y el seed ficticio
        run: npm run db:start
      - name: Preparar .env.local efímero (claves locales de loopback)
        run: |
          eval "$(npx supabase status -o env)"
          publishable="${PUBLISHABLE_KEY:-$ANON_KEY}"
          secret="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          password="$(node -e 'console.log(require("node:crypto").randomBytes(24).toString("base64url"))')"
          echo "::add-mask::$secret"
          echo "::add-mask::$password"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable"
            echo "SUPABASE_SERVICE_ROLE_KEY=$secret"
            echo "FERIA_DEMO_PASSWORD=$password"
            echo "FER_INTELLIGENCE_MODE=demo"
          } > .env.local
          echo "Supabase local en $API_URL"
      - name: Cuentas y membresías ficticias
        run: npm run demo:seed
      - name: Control SQL de grants RPC y RLS
        id: permissions
        if: always()
        run: docker exec -i supabase_db_feria psql -X -U postgres -v ON_ERROR_STOP=1 < tests/qa-permissions.sql
      - name: Rollback atómico de ventas
        id: atomic
        if: always()
        run: npm run test:atomic
      - name: Rollback atómico de cobros
        id: collection_atomic
        if: always()
        run: npm run test:collection-atomic
      - name: Rollback atómico conversacional
        id: conversation_atomic
        if: always()
        run: npm run test:conversation-atomic
      - name: Integración DB (dinero, permisos, aislamiento)
        id: db
        if: always()
        run: npm run test:db
      - name: Integración de cobros
        id: collections
        if: always()
        run: npm run test:collections
      - name: Integración de operaciones (cierre y conciliación)
        id: operations
        if: always()
        run: npm run test:operations
      - name: Integración del asistente (modo demo)
        id: intelligence
        if: always()
        run: npm run test:intelligence
      - name: Integración conversacional
        id: conversation
        if: always()
        run: npm run test:conversation
      - name: Integración de seguridad
        id: security
        if: always()
        run: npm run test:security
      - name: Compilar la app
        id: build
        if: always()
        run: npm run build
      - name: Instalar Chromium de Playwright
        if: always() && steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        id: e2e
        if: always() && steps.build.outcome == 'success'
        run: npm run test:e2e -- --reporter=list,html
      - name: Regresión de acceso sin JavaScript
        id: nojs
        if: always() && steps.build.outcome == 'success' && hashFiles('scripts/test-login-no-js.mjs') != ''
        run: |
          set -a; . ./.env.local; set +a
          npx next start -p 3200 --hostname 127.0.0.1 > next-nojs.log 2>&1 &
          npx wait-on -t 60000 http://127.0.0.1:3200/acceso 2>/dev/null || sleep 15
          FERIA_APP_URL=http://127.0.0.1:3200 node --test scripts/test-login-no-js.mjs
      - name: Fiscal offline (sin emisión real) en Supabase de puerto alternativo
        id: fiscal
        if: always()
        run: |
          # El test fiscal exige una instancia desechable fuera del puerto 54321.
          npx supabase stop --no-backup
          sed -i -E -e 's/^project_id = "feria"/project_id = "feria-fiscal"/' -e 's/= 543([0-9]{2})$/= 553\1/' supabase/config.toml
          npm run db:start
          eval "$(npx supabase status -o env)"
          publishable="${PUBLISHABLE_KEY:-$ANON_KEY}"
          secret="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          echo "::add-mask::$secret"
          sed -i -e "s|^NEXT_PUBLIC_SUPABASE_URL=.*|NEXT_PUBLIC_SUPABASE_URL=$API_URL|" \
            -e "s|^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=.*|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable|" \
            -e "s|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=$secret|" .env.local
          echo "FERIA_FISCAL_DISPOSABLE_URL=$API_URL" >> .env.local
          npm run demo:seed
          npm run test:fiscal
      - name: Resumen
        if: always()
        run: |
          {
            echo "## E2E FER AI — ${GITHUB_SHA}"
            echo "| Suite | Resultado |"
            echo "| --- | --- |"
            echo "| qa-permissions.sql | ${{ steps.permissions.outcome }} |"
            echo "| sales-rollback.sql | ${{ steps.atomic.outcome }} |"
            echo "| collection-rollback.sql | ${{ steps.collection_atomic.outcome }} |"
            echo "| conversation-rollback.sql | ${{ steps.conversation_atomic.outcome }} |"
            echo "| test:db | ${{ steps.db.outcome }} |"
            echo "| test:collections | ${{ steps.collections.outcome }} |"
            echo "| test:operations | ${{ steps.operations.outcome }} |"
            echo "| test:intelligence | ${{ steps.intelligence.outcome }} |"
            echo "| test:conversation | ${{ steps.conversation.outcome }} |"
            echo "| test:security | ${{ steps.security.outcome }} |"
            echo "| test:fiscal | ${{ steps.fiscal.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
            echo "| Playwright | ${{ steps.e2e.outcome }} |"
            echo "| acceso sin JS | ${{ steps.nojs.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar reporte de Playwright
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
